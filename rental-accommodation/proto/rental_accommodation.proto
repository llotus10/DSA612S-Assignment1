syntax = "proto3";

package rental;

service RentalAccommodationService {

    rpc AddProperty(PropertyRequest)
        returns (PropertyResponse);

    rpc UpdateProperty(UpdatePropertyRequest)
        returns (PropertyResponse);

    rpc RemoveProperty(RemovePropertyRequest)
        returns (PropertyList);

    rpc CreateUsers(stream UserRequest)
        returns (UserCreationResponse);

    rpc RegisterUser(RegisterUserRequest)
        returns (RegisterUserResponse);

    rpc LoginUser(LoginUserRequest)
        returns (LoginUserResponse);

    rpc ListAvailableProperties(PropertyFilter)
        returns (stream PropertyResponse);

    rpc SearchProperty(SearchPropertyRequest)
        returns (PropertySearchResponse);

    rpc BookProperty(BookPropertyRequest)
        returns (BookPropertyResponse);

    rpc ConfirmBooking(ConfirmBookingRequest)
        returns (ConfirmBookingResponse);
}


message PropertyRequest {
    string property_name = 1;
    string location = 2;
    string property_type = 3;
    double price_per_night = 4;
    string status = 5;
    string host_id = 6;
    string region = 7;
}


message PropertyResponse {
    string property_id = 1;
    string property_name = 2;
    string location = 3;
    string property_type = 4;
    double price_per_night = 5;
    string status = 6;
    string host_id = 7;
    string region = 8;
}


message UpdatePropertyRequest {
    string property_id = 1;
    string property_name = 2;
    string location = 3;
    string property_type = 4;
    double price_per_night = 5;
    string status = 6;
}


message RemovePropertyRequest {
    string property_id = 1;
    string host_id = 2;
    string region = 3;
}


message PropertyList {
    repeated PropertyResponse properties = 1;
}


message UserRequest {
    string user_id = 1;
    string name = 2;
    string role = 3;
    string region = 4;
}


message UserCreationResponse {
    bool success = 1;
    int32 users_created = 2;
    string message = 3;
}


message RegisterUserRequest {
    string user_id = 1;
    string name = 2;
    string password = 3;
    string region = 4;
}


message RegisterUserResponse {
    bool success = 1;
    string message = 2;
    string user_id = 3;
    string role = 4;
}


message LoginUserRequest {
    string user_id = 1;
    string password = 2;
}


message LoginUserResponse {
    bool success = 1;
    string message = 2;
    string user_id = 3;
    string name = 4;
    string role = 5;
    string region = 6;
}


message PropertyFilter {
    string location = 1;
    double min_price = 2;
    double max_price = 3;
}


message SearchPropertyRequest {
    string property_id = 1;
}


message PropertySearchResponse {
    bool available = 1;
    string message = 2;
    PropertyResponse property = 3;
}


message BookPropertyRequest {
    string property_id = 1;
    string check_in = 2;
    string check_out = 3;
}


message BookPropertyResponse {
    bool success = 1;
    string message = 2;
    string property_id = 3;
    string check_in = 4;
    string check_out = 5;
}


message ConfirmBookingRequest {
    string property_id = 1;
    string check_in = 2;
    string check_out = 3;
}


message ConfirmBookingResponse {
    bool success = 1;
    string message = 2;
    string property_id = 3;
    string check_in = 4;
    string check_out = 5;
    int32 nights = 6;
    double total_price = 7;
}